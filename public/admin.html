<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Page</title>
    <link rel="stylesheet" href="styles/globals.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bonheur+Royale&display=swap" rel="stylesheet">
</head>
<body>

<!-- Main content initially hidden -->
<div id="admin-content" style="display:none;">
    <header>
        <h1>Administration Module</h1>
    </header>
    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>Report ID</th>
                <th>Message</th>
            </tr>
            </thead>
            <tbody id="admin-tbody">
            <!-- Data will be inserted here by JavaScript -->
            </tbody>
        </table>
    </div>
    <footer>
        <a href="index.html">
            <button class="home_button">Home</button>
        </a>
        <div class="authors">
            by
            <a class="linkedin" href="https://www.linkedin.com/in/radu-dan-stefan/">Radu Dan</a>
            &
            <a class="linkedin" href="https://www.linkedin.com/in/adrian-popa-957643239/">Popa Adrian</a>
        </div>
    </footer>
</div>

<script>
    // Password verification logic remains the same
    (function() {
        const password = prompt("Please enter the admin password:");
        if (password === null) {
            window.location.href = 'index.html';
            return;
        }
        fetch('/api/admin/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: password }),
        })
            .then(response => {
                if (response.ok) {
                    document.getElementById('admin-content').style.display = 'flex';
                } else {
                    alert("Wrong password. You will be redirected to the home page.");
                    window.location.href = 'index.html';
                }
            })
            .catch(error => {
                console.error('Error during authentication:', error);
                alert("An error occurred during authentication. Please try again.");
                window.location.href = 'index.html';
            });
    })();
</script>
<script src="/utils/adminReportRetrieveHelper.js"></script>

</body>
</html>
