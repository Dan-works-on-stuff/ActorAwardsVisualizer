<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/news-style.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <title>Actor and Awards Explorer</title>
</head>
<body>
<h1>Actor Movies & Awards</h1>
<div class="search-container">
    <input type="text" id="search-input" placeholder="Enter actor name...">
    <button id="search-button">Search</button>
</div>

<div id="celebrity-name"></div>
<div id="news-container" class="news-container"></div>

<script>
    // Fetches movies and (optionally) awards for the actor
    async function fetchNews(query = '') {
        try {
            const apiUrl = query
                ? `/api/celebrity-news?query=${encodeURIComponent(query)}`
                : '/api/celebrity-news';

            const response = await fetch(apiUrl);

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();

            const celebElem = document.getElementById('celebrity-name');
            const newsContainer = document.getElementById('news-container');

            if (data.error) {
                celebElem.innerHTML = '';
                newsContainer.innerHTML = `<p>${data.error}</p>`;
                return;
            }

            if (data.celebrity) {
                celebElem.innerHTML = `<h2>${data.celebrity}</h2>`;
            } else {
                celebElem.innerHTML = '';
            }

            // If results (movies) found, show them
            if (data.news && Array.isArray(data.news) && data.news.length > 0) {
                newsContainer.innerHTML = data.news.map(movie => `
                    <div class="news-item">
                        ${movie.poster ? `<img src="${movie.poster}" alt="${movie.title} poster" style="width:90px; float:left; margin-right:10px;" />` : ''}
                        <h3><a href="${movie.url}" target="_blank">${movie.title}</a></h3>
                        <p>${movie.description || ''}</p>
                    </div>
                `).join('');
            } else {
                newsContainer.innerHTML = `<p>No movies or awards found for this person.</p>`;
            }
        } catch (error) {
            document.getElementById('celebrity-name').innerHTML = '';
            document.getElementById('news-container').innerHTML =
                '<p>Error loading data. Please try again.</p>';
        }
    }

    const searchInput = document.getElementById('search-input');
    const searchButton = document.getElementById('search-button');

    searchButton.addEventListener('click', () => {
        const query = searchInput.value.trim();
        fetchNews(query);
    });

    searchInput.addEventListener('keypress', event => {
        if (event.key === 'Enter') {
            event.preventDefault();
            const query = searchInput.value.trim();
            fetchNews(query);
        }
    });

    // Optionally, load trending on page load
    // fetchNews();
</script>
</body>
</html>
