<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/Logo.png" type="image/png">
    <link rel="stylesheet" href="styles/globals.css">
    <link rel="stylesheet" href="styles/search.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <title>Actor and Awards Explorer</title>
</head>
<body>
<h1>Actor Movies & News</h1>
<div class="search-container">
    <input type="text" id="search-input" placeholder="Enter actor name..." aria-label="Enter actor name">
    <button id="search-button">Search</button>
</div>

<div id="profile-container"></div>

<!-- Toggle Switch for Movies/News -->
<div id="view-toggle-container" style="display: none;">
    <label class="switch">
        <input type="checkbox" id="view-toggle">
        <span class="slider round"></span>
    </label>
</div>

<div id="news-container" class="news-grid"></div>

<script src="/utils/searchHelper.js" defer></script>
</body>
</html>
