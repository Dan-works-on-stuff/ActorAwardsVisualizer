<!DOCTYPE html>
<html lang="en">
<head>

    <title>Top Actors and Movies by Nominations</title>
    <!-- Using Chart.js for visualization -->

    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
<h1>Top Actors and Movies by Nominations (Last 10 Years)</h1>

</div>
<div class="chart-container" style="position: relative; height:60vh; width:90vw; margin: auto;">

<div>
    <button id="showMore">Show More</button>
    <button id="showLess">Show Less</button>

<!-- Script to fetch data and render the chart -->
<script src="/utils/topActorsHelper.js"></script>
