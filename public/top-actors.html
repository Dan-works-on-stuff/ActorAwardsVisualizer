<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Top Actors and Movies by Nominations</title>
    <!-- Using Chart.js for visualization -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>
    <link rel="stylesheet" href="styles/globals.css">
    <link rel="stylesheet" href="styles/top-actors.css">
    <link rel="stylesheet" href="styles/fonts.css">
</head>
<body>
<main class="main-container">
    <h1>Top Actors and Movies by Nominations (Last 10 Years)</h1>
    <div class="controls-container">
        <button id="showActors">Actors</button>
        <button id="showMovies">Movies</button>
    </div>
    <div class="chart-container">
        <canvas id="topActorsChart"></canvas>
    </div>
    <div class="controls-container">
        <button id="showMore">Show More</button>
        <button id="showLess">Show Less</button>
    </div>

    <div>
        <button id="exportCsv">Export to CSV</button>
        <button id="exportWebp">Export to WebP</button>
        <button id="exportSvg">Export to SVG</button>
        <button id="reportButton">Report</button>
    </div>

</main>
<!-- Script to fetch data and render the chart -->
<script src="/utils/canvas2svg.js"></script>
<script src="/utils/exportHelper.js"></script>
<script src="/utils/topActorsHelper.js"></script>
<script src="/utils/reportHelper.js"></script>

</body>
</html>
