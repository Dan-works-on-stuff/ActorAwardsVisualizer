</head>
<body>
<div class="container_title">
    <img alt="logo" class="logo" src="images/Logo.svg">
    <div class="title-and-buttons">
        <h1>SAG Chronicles</h1>
        <div class="button-container">
            <a href="search.html">
                <button class="search_button">Search Actor</button>
            </a>
            <a href="top-actors.html">
                <button class="stats_button">Stats</button>
            </a>
            <a href="winners-table.html">
                <button class="stats_button">Winners</button>
            </a>
            <a href="category-stats.html">
                <button class="stats_button">Category Stats</button>
            </a>
        </div>
    </div>
</div>

<footer>

    data from <a class="TMDB" href="https://www.themoviedb.org/"><img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg" alt="TMDb logo" style="height: 1em; vertical-align: middle;"></a>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const logoElement = document.querySelector('.logo');
        let clickCount = 0;
        let clickTimer = null;

        logoElement.addEventListener('click', () => {
            clickCount++;

            if (clickTimer) {
                clearTimeout(clickTimer);
            }

            // Reset the count if there's a pause of more than 2 seconds between clicks
            clickTimer = setTimeout(() => {
                clickCount = 0;
            }, 2000);

            // Redirect to admin page on the 7th click
            if (clickCount === 7) {
                window.location.href = 'admin.html';
            }
        });
    });
</script>
</body>
</html>
